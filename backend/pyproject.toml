[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mait-campusfix-backend"
version = "0.1.0"
description = "MAIT CampusFix maintenance complaint management backend foundation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Maharaja Agrasen Institute of Technology - CampusFix Team" }
]
keywords = ["campus-maintenance", "complaints", "accountability", "mait"]
dependencies = [
    "boto3==1.44.11",
    "botocore==1.44.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
